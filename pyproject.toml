[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wikillm"
version = "0.1.0"
description = "A multi-format Wiki-LLM knowledge base exposing both a REST API and an MCP server (stdio + HTTP/SSE)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Wiki-LLM" }]
keywords = ["mcp", "rag", "knowledge-base", "embeddings", "fastapi", "vector-search"]

dependencies = [
    "mcp>=1.2.0,<2.0",
    "fastapi>=0.110,<1.0",
    "uvicorn[standard]>=0.29,<1.0",
    "python-multipart>=0.0.9",
    "sse-starlette>=2.1",
    "pydantic>=2.6,<3.0",
    "pydantic-settings>=2.2,<3.0",
    "python-dotenv>=1.0",
    "pypdf>=4.2",
    "markdown-it-py>=3.0",
    "charset-normalizer>=3.3",
    "python-docx>=1.1",
    "httpx>=0.27",
    "chromadb>=0.5",
    "qdrant-client>=1.9",
    "numpy>=1.26",
]

[project.optional-dependencies]
local = ["sentence-transformers>=2.7"]

[project.scripts]
wikillm-http = "wikillm.rest_api:main"
wikillm-stdio = "wikillm.mcp_server:main"

[tool.setuptools.packages.find]
include = ["wikillm*"]

[tool.setuptools.package-data]
wikillm = ["py.typed"]
